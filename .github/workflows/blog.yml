name: Latest Blog Posts

on:
  schedule:
    - cron: "0 */12 * * *" # twice a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull latest dev.to posts into README
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://dev.to/feed/ibraheembello"
          max_post_count: 5
          commit_message: "chore: update latest blog posts"
